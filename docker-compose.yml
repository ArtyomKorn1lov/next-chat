services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT}
    restart: unless-stopped
    ports:
      - "8001:3000"
    volumes:
      - ./frontend/:/app/
    networks:
      - chat

  backend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    links:
      - mysql
    ports:
      - "8002:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - chat
    privileged: true

  php:
    build:
      context: ./backend/
      dockerfile: Dockerfile
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    restart: unless-stopped
    links:
      - mysql
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - chat

  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    volumes:
      - mysql:/var/lib/mysql
    env_file:
      - ./docker/config/mysql/env.yml
    restart: unless-stopped
    networks:
      - chat

  phpmyadmin:
    image: phpmyadmin
    links:
      - mysql
    ports:
      - "8003:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOSTS=mysql
    volumes:
      - phpmyadmin:/sessions
    restart: unless-stopped
    networks:
      - chat

volumes:
  mysql:
  phpmyadmin:

networks:
  chat:
    driver: bridge