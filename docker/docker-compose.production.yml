name: ChatProduction

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/images/frontend/Dockerfile.production
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    restart: unless-stopped
    ports:
      - "8001:3000"
    networks:
      - chat

  backend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    links:
      - mysql
    ports:
      - "8003:80"
    volumes:
      - ../backend:/var/www/html:ro
      - ./volumes/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - chat

  php:
    build:
      context: ../backend/
      dockerfile: ../docker/images/backend/Dockerfile.production
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    links:
      - mysql
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
    networks:
      - chat

  mysql:
    build:
      context: ./images/mysql
      dockerfile: Dockerfile
    volumes:
      - mysql:/var/lib/mysql
    env_file:
      - ./volumes/mysql/env.yml
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chat

  phpmyadmin:
    image: phpmyadmin
    links:
      - mysql
    ports:
      - "8004:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOSTS=mysql
    volumes:
      - phpmyadmin:/sessions
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - chat

volumes:
  mysql:
  phpmyadmin:

networks:
  chat:
    driver: bridge